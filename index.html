<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리스닝">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>리스닝</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div id="mini"></div>
  <nav id="tabs"></nav>
  <section id="player" aria-label="재생 화면"></section>
  <div id="sheet-root"></div>
  <div id="dlg-root"></div>
  <div id="toast" role="status"></div>
</div>
<input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple hidden>
<input type="file" id="json-input" accept="application/json,.json" hidden>
<input type="file" id="img-input" accept="image/*" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
